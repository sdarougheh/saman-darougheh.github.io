      - title: "AI Adoption and Firm Size: Employment Effects in Monthly Administrative Data"
        authors: <a href="https://sites.google.com/view/simone-maria-bonin/home-page?pli=1">Simone Bonin</a>, Andreas Kuchler
        links:
          - url: https://www.nationalbanken.dk/en/news-and-knowledge/publications-and-speeches/working-paper/2026/ai-adoption-and-firm-size-employment-effects-in-monthly-administrative-data
            desc: Danmarks Nationalbank WP
          - desc: 'Press: <a href="https://www.dr.dk/nyheder/penge/ny-analyse-virksomheder-der-bruger-ai-ansaetter-faerre">DR</a>, <a href="https://nyheder.tv2.dk/samfund/2026-09-14-ai-aendrer-arbejdsmarkedet-to-grupper-er-saerligt-udsatte-siger-nationalbanken">TV 2</a>, <a href="https://politiken.dk/edition/news/art10984518/The-Danish-central-bank-Our-data-now-show-the-consequences-of-AI-making-its-way-into-Danish-workplaces">Politiken</a>, <a href="https://www.berlingske.dk/oekonomi/nu-saetter-nationalbanken-tal-paa-disse-grupper-bliver-foerst-erstattet-af-kunstig-intelligens">Berlingske</a>, <a href="https://borsen.dk/nyheder/okonomi/nationalbanken-nu-ser-vi-de-forste-tegn-pa-ai-omstilling">Børsen</a> (<a href="https://borsen.dk/nyheder/ai/analyse-ai-far-danske-virksomheder-til-at-ansaette-faerre">2</a>, <a href="https://borsen.dk/nyheder/opinion/fremtidens-medarbejder-er-ikke-fyret-endnu">3</a>), <a href="https://finans.dk/okonomi/ECE19641614/nationalbankdirektoer-om-ai-vi-er-bekymrede-men-positivt-stemte/">Finans</a> (<a href="https://finans.dk/debat/ECE19670980/hvem-skal-vaere-senior-om-10-aar/">2</a>), <a href="https://www.information.dk/indland/2026/09/unge-hoejtuddannede-betaler-indtil-videre-prisen-ais-indtog-paa-arbejdsmarkedet">Information</a>, <a href="https://www.kristeligt-dagblad.dk/danmark/analyse-ai-faar-danske-virksomheder-til-ansaette-faerre">Kristeligt Dagblad</a>, <a href="https://www.tv2fyn.dk/danmark/ai-far-danske-virksomheder-til-at-ansaette-faerre-to-grupper-er-saerligt-udsatte-9e608">TV 2 Fyn</a>, <a href="https://www.tv2ostjylland.dk/oestjylland/ai-far-danske-virksomheder-til-at-ansaette-faerre-faf66">TV2 Østjylland</a>, <a href="https://www.tvmidtvest.dk/midt-og-vestjylland/virksomheder-ansaetter-faerre-nar-de-begynder-at-bruge-ai-c1172">TV MIDTVEST</a>'
        images:
          - link: ai_adoption_size.png
            caption: "Event-study coefficients of log FTE employment around AI adoption, estimated separately for 2023 adopters with fewer than 100 FTEs and with 100 or more FTEs at the pre-period base. Employment of small and large adopters is indistinguishable from pre-trend before 2023; thereafter small adopters fall steadily below trend, reaching about -15 log points by late 2025, while large adopters continue along trend. Shaded areas are 95% confidence bands."
        conference: CCBS Conference 2026, EPRN Conference 2026, Deutsche Bundesbank 2026, IAB-FU-RWI Workshop on Labor Markets and Financial Markets 2026
        summary: |
          How do firms adjust their employment after adopting artificial intelligence (AI)? Using a unique dataset of Danish firm-level AI adoption data matched to monthly employer-employee records, we find that firms that adopted AI in 2023 reduced employment growth by 11 per cent relative to non-adopters by late 2025. Effects are concentrated in smaller firms and reflect lower recruitment, particularly in AI-exposed occupations. Economy-wide employment is so far relatively unaffected.

      - title: "On-the-Job Search and Inflation under the Microscope"
        authors: <a href="https://sites.google.com/site/econrenatofaccini/">Renato Faccini</a>, <a href="https://sites.google.com/site/lemelosi/">Leonardo Melosi</a>, <a href="https://www.alessandrotenzinvilla.com/">Alessandro T. Villa</a>
        links:
          - url: https://cepr.org/publications/dp19795
            desc: CEPR Working Paper
          - url: https://www.nationalbanken.dk/en/news-and-knowledge/publications-and-speeches/working-paper/2025/on-the-job-search-and-inflation-under-the-microscope
            desc: Danmarks Nationalbank WP

        images:
        conference: Bank of Finland, Bundesbank Spring conference 2024, SED 2024, ECSB Cluster 2 (2024), ECSB Cluster 1 (2024), ESSIM 2025
        summary: |
          Job-to-job transitions are (wage) inflationary and decrease vacancy posting, thereby challenging the traditional view on the relationship between inflation and unemployment. The model explains the effects of the 2012 Danish reform on employment transitions and wage growth.

      - title: "Getting Real About Wages: A Nonhomothetic Wage Deflator"
        conference: ES Winter Meetings 2025, ESEM 2026
        authors: <a href="https://phhoc.github.io/">Philipp Hochmuth</a>, <a href="https://www.marciasilvapereira.com/">Márcia Silva Pereira</a>, <a href="https://www.markuspettersson.net/">Markus Pettersson</a>
        links:
          - url: https://sdaro.s3.eu-central-1.amazonaws.com/public/real_wages/draft.pdf
            desc: draft
          - desc: R&amp;R (The Review of Economics and Statistics)
        summary: |
          Conventional real wages—nominal wages divided by a consumption deflator—are biased from a welfare perspective when households value leisure and exhibit nonhomothetic consumption behavior. We derive a true wage deflator and show that standard measures underestimate real wage growth and welfare growth between 1984 and 2019. Our deflator leads to similar conclusions as the conventional CPI deflator when studying the evolution of wages during the post-Covid inflation surge.

      - title: "Confused about Careers? Untangling Occupational Mobility, Miscoding and Distance"
        authors: <a href="https://sites.google.com/site/carloscarrillotudela/">Carlos Carrillo-Tudela</a> and <a href="https://sites.google.com/site/ludosresearch/">Ludo Visschers</a>
        links:
          - url: https://cepr.org/publications/dp20217
            desc: CEPR discussion paper
          - url: https://www.nationalbanken.dk/en/news-and-knowledge/publications-and-speeches/working-paper/2025/confused-about-careers-untangling-occupational-mobility-miscoding-and-distance
            desc: Danmarks Nationalbank WP
        images:

        conference: EALE 2023, World Labor Congress 2025, Aarhus University 2026, 2026 Konstanz Macro-Labor Workshop
        summary: |
          US surveys on occupations contain a lot of mistakes. We estimate these mistakes and show that they not only lead to false estimate of whether an occupational change occurred, but also how far it was.  Miscoding can also be informative about occupational distance itself, since closely-related occupations are more likely to be miscoded into each other.




      - title: "Why VAT Pass-Through Varies Across Countries: The Role of Market Power"
        authors: <a href="https://www.tiagobernardino.com/">Tiago Bernardino</a>, <a href="https://pedrobrinca.pt/">Pedro Brinca</a>, and <a href="https://www.marciasilvapereira.com/">Marcia Silva-Pereira</a>
        links:
          - url: https://sdaro.s3.eu-central-1.amazonaws.com/public/vat_market_countries/vat_market_countries.pdf
            desc: draft
        images:
          - link: market_power_cross_country.jpg
            caption: "The figure plots country-level average HHI (employment-weighted) against pass-through estimates. Circle size is inversely proportional to the variance of the first-stage estimate and thus reflects its precision. The estimated coefficient is -0.13 with a p-value of 0.089. The R2 is 0.16."
        conference:
        summary: |
            The pass-through of value-added taxes depends on market concentration. European countries differ significantly in their average market concentration, which explains 16% of the cross-country differences in VAT pass-through.


